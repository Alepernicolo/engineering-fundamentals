# Values for the upstream argo-cd chart are nested under the dependency name.
# Reference: https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
argo-cd:
  # Keep CRDs when the release is uninstalled, so Applications are not wiped by accident
  crds:
    install: true
    keep: true

  global:
    # Access via `kubectl port-forward` for now; set a real domain once an ingress exists
    domain: argocd.local

  configs:
    params:
      # TLS is terminated by port-forward / a future ingress, not by argocd-server
      server.insecure: true
    cm:
      # Poll the Git repository every 3 minutes (default); a webhook can make this instant
      timeout.reconciliation: 180s

  # Not needed: we log in with the built-in admin account (no SSO)
  dex:
    enabled: false

  # Not needed for this exercise; saves resources on the single small node
  notifications:
    enabled: false

  server:
    service:
      type: ClusterIP
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }

  controller:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

  repoServer:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }

  applicationSet:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }

  redis:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }

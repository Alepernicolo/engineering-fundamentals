# Values for the upstream charts are nested under each dependency name.
# Traefik:      https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
# cert-manager: https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

traefik:
  ingressClass:
    enabled: true
    isDefaultClass: true

  service:
    spec:
      type: LoadBalancer
    annotations:
      # Gives the public IP a free DNS name: engfundape.switzerlandnorth.cloudapp.azure.com
      # (must be unique within the Azure region)
      service.beta.kubernetes.io/azure-dns-label-name: engfundape

  ports:
    web:
      # Redirect all HTTP traffic to HTTPS ...
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      # ... except Let's Encrypt HTTP-01 challenges (/.well-known/acme-challenge/), which must be served over HTTP
      allowACMEByPass: true

  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

cert-manager:
  crds:
    enabled: true
    # Keep CRDs (and thereby all Certificates) if the release is uninstalled
    keep: true

  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
  webhook:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  cainjector:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }

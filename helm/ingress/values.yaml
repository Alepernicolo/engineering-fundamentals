# Values for the upstream charts are nested under each dependency name.
# Traefik:      https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
# cert-manager: https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml

traefik:
  ingressClass:
    enabled: true
    isDefaultClass: true
    # Fixed name referenced by the app's Ingress and the cert-manager Issuer
    # (the chart would otherwise name it after the release, e.g. "ingress-traefik")
    name: traefik

  service:
    spec:
      # Private: no public IP. The app and ArgoCD are only reachable via `kubectl port-forward`,
      # which requires an Entra ID login in the ipt tenant (see infra/main.tf).
      # To expose publicly again (behind an Entra ID login proxy), switch back to LoadBalancer
      # with the annotation service.beta.kubernetes.io/azure-dns-label-name: engfundape
      type: ClusterIP

  ports:
    web:
      # Redirect all HTTP traffic to HTTPS ...
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      # ... except Let's Encrypt HTTP-01 challenges (/.well-known/acme-challenge/), which must be served over HTTP
      allowACMEByPass: true

  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

cert-manager:
  crds:
    enabled: true
    # Keep CRDs (and thereby all Certificates) if the release is uninstalled
    keep: true

  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
  webhook:
    # AKS's admissions enforcer adds these exclusions to every webhook. Declaring them here
    # keeps Helm (server-side apply) and AKS in agreement; otherwise every upgrade fails with
    # "conflict with admissionsenforcer ... namespaceSelector".
    validatingWebhookConfiguration:
      namespaceSelector:
        matchExpressions:
          - key: cert-manager.io/disable-validation
            operator: NotIn
            values: ["true"]
          - key: control-plane
            operator: NotIn
            values: ["true"]
          - key: kubernetes.azure.com/managedby
            operator: NotIn
            values: ["aks"]
    mutatingWebhookConfiguration:
      namespaceSelector:
        matchExpressions:
          - key: kubernetes.azure.com/managedby
            operator: NotIn
            values: ["aks"]
          - key: control-plane
            operator: NotIn
            values: ["true"]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  cainjector:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }

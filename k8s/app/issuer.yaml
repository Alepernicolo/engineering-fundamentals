# Let's Encrypt (production) via cert-manager, proving domain ownership with an HTTP-01 challenge through Traefik.
# Requires cert-manager in the cluster (installed by the helm/ingress chart).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Private key of the Let's Encrypt account, created by cert-manager
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik

apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-fundamentals
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: engineering-fundamentals
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: engineering-fundamentals
    spec:
      securityContext:
        # The image runs as the "nodeapp" user by name; Kubernetes needs a numeric UID
        # to enforce runAsNonRoot. The app files are world-readable, so any non-root UID works.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Name and tag are set in kustomization.yaml (images:)
          image: engineering-fundamentals
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable scratch space, since the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

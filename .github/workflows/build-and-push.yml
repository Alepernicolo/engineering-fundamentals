name: Build and Push to ACR

on:
  push:
    branches: [main] # runs when a PR is merged -> image is pushed
  pull_request:
    branches: [main] # build only, to verify the Dockerfile still works
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC login to Azure (no stored secrets)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: engineering-fundamentals
  # Read from repository Variables, falling back to Secrets if stored there
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ vars.ACR_NAME || secrets.ACR_NAME }}
  REGISTRY: ${{ vars.ACR_NAME || secrets.ACR_NAME }}.azurecr.io
  # Push only from main (PR merge / manual run on main), never from PRs
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs to protect against tag hijacking
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Azure configuration
        if: env.PUSH == 'true'
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it under Settings > Secrets and variables > Actions > Variables (use 'terraform output')."
              missing=1
            fi
          done
          exit $missing

      - name: Azure login (OIDC, user assigned managed identity)
        if: env.PUSH == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: env.PUSH == 'true'
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v1.0.${{ github.run_number }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "### Pushed image :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Part E bonus: GitOps image promotion.
  # After a new image is pushed, write its tag into the app's Kustomize manifest and commit it.
  # ArgoCD watches k8s/app on main, sees the commit and rolls out the new version.
  # Commits made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
  update-manifest:
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the manifest change to main

    env:
      IMAGE_TAG: v1.0.${{ github.run_number }}
      KUSTOMIZATION: k8s/app/kustomization.yaml

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set image tag in kustomization
        run: |
          # yq is preinstalled on GitHub-hosted Ubuntu runners
          yq -i '(.images[] | select(.name == "engineering-fundamentals").newTag) = strenv(IMAGE_TAG)' "$KUSTOMIZATION"
          git diff --stat

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Manifest already at $IMAGE_TAG, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): update engineering-fundamentals image to $IMAGE_TAG"
          # Retry with rebase in case main moved on while the image was building
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt), rebasing on latest main..."
            git pull --rebase origin main
          done
          echo "::error::Could not push the manifest update after 3 attempts"
          exit 1

      - name: Summary
        run: |
          echo "### Deployment manifest updated :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$KUSTOMIZATION\` now uses image tag \`$IMAGE_TAG\`; ArgoCD will roll it out." >> "$GITHUB_STEP_SUMMARY"
